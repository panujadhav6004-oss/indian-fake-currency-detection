<!DOCTYPE html>
<html>
<head>
    <title>Payment Successful</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050505;
    color:#fff;
    padding:30px;
}

.success-card{
    width:460px;
    padding:34px;
    border-radius:18px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(0,230,118,0.55);
    text-align:center;
    box-shadow:0 0 40px rgba(0,255,100,0.32);
}

.icon{
    width:78px;
    height:78px;
    line-height:78px;
    margin:0 auto 18px;
    border-radius:50%;
    background:#00e676;
    color:#001b0d;
    font-size:42px;
    font-weight:700;
}

h1{
    color:#ffd600;
    margin-bottom:10px;
}

.details{
    margin:22px 0;
    padding:18px;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    text-align:left;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-bottom:10px;
}

.row:last-child{
    margin-bottom:0;
}

.value{
    color:#00e676;
    font-weight:700;
    text-align:right;
    word-break:break-all;
}

.btn{
    display:block;
    padding:13px;
    border-radius:10px;
    background:linear-gradient(135deg,#00e676,#ffd600);
    color:#000;
    text-decoration:none;
    font-weight:700;
}
</style>
</head>

<body>

<div class="success-card">
    <div class="icon">✓</div>
    <h1>Payment Successful</h1>
    <p>Your subscription plan is now active.</p>

    <div class="details">
        <div class="row">
            <span>Amount</span>
            <span class="value">Rs {{ payment.amount }}</span>
        </div>
        <div class="row">
            <span>Plan</span>
            <span class="value">{{ payment.plan_months }} month(s)</span>
        </div>
        <div class="row">
            <span>Expiry Date</span>
            <span class="value">{{ subscription.expires_at|date:"d M Y" }}</span>
        </div>
        <div class="row">
            <span>Transaction ID</span>
            <span class="value">{{ payment.transaction_id }}</span>
        </div>
    </div>

    <a href="{% url 'dashboard' %}" class="btn">
        Go to Dashboard
    </a>
</div>

</body>
</html>
