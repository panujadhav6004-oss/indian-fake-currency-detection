{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Password Changed</title>
</head>

<style>
body{
    background: linear-gradient(135deg,#667eea,#764ba2);
    font-family:Poppins;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.card{
    background:white;
    padding:40px;

.icon{ font-size:60px; }
a{
    display:inline-block;
    margin-top:20px;
    text-decoration:none;
    background:#667eea;
    color:white;
    padding:10px 20px;
    border-radius:8px;
}
</style>

<body>
<div class="card">
    <div class="icon">✅</div>
    <h2>Password Changed!</h2>
    <p>Your password has been successfully updated.</p>

</div>

</html>
