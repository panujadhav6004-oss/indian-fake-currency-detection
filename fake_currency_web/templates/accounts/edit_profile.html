{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>
    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* BACKGROUND */
body{
    min-height:100vh;
    color:white;
    background:url("{% static 'images/bg.jpeg' %}") center/cover no-repeat fixed;
    display:flex;
    justify-content:center;
    align-items:center;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    z-index:-1;
}

/* NAVBAR */
.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 30px;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(10px);
}

.navbar h2{
    color:#ffd600;
    font-size:20px;
}

.logout{
    color:#00e676;
    text-decoration:none;
    font-weight:600;
    font-size:14px;
}

/* FORM CARD */
form{
    background:rgba(0,0,0,0.7);
    padding:35px;
    border-radius:20px;
    width:420px;
    backdrop-filter:blur(12px);
    box-shadow:0 0 30px rgba(0,255,100,0.25);
    margin-top:80px;
}

h2{
    text-align:center;
    margin-bottom:15px;
    color:#ffd600;
}

.section-title{
    margin-top:15px;
    margin-bottom:5px;
    font-size:14px;
    color:#aaa;
}

/* INPUTS */
input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:10px;
    outline:none;
    background:rgba(255,255,255,0.08);
    color:white;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    background:linear-gradient(135deg,#00e676,#ffd600);
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    margin-top:15px;
    box-shadow:0 0 20px rgba(0,255,100,0.6);
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>
    <div class="navbar">
    <h2>💰 Fake Currency Detection</h2>
    <a class="logout" href="/accounts/profile/">⬅ Back to Profile</a>
</div>

<form method="POST">
    {% csrf_token %}

    <h2>Edit Profile</h2>

    <!-- USER INFO -->
    <div class="section-title">User Details</div>

    <input type="text" name="username" value="{{ user.username }}" placeholder="Username">
    <input type="email" name="email" value="{{ user.email }}" placeholder="Email">
    <input type="text" name="first_name" value="{{ user.first_name }}" placeholder="First Name">
    <input type="text" name="last_name" value="{{ user.last_name }}" placeholder="Last Name">

    <!-- PROFILE INFO -->
    <div class="section-title">Profile Details</div>

    <input type="text" name="phone" value="{{ profile.phone }}" placeholder="Phone Number">
    <input type="text" name="address" value="{{ profile.address }}" placeholder="Address">

    <button type="submit">Save Changes</button>
</form>

</body>
</html>
