{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Password Updated</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:url("https://images.unsplash.com/photo-1607083206968-13611e3d76db") no-repeat center/cover;
    color:white;
}

/* dark overlay */
body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.88);
    z-index:-1;
}

/* NAVBAR */
.navbar{
    position:fixed;
    top:0;
    width:100%;
    height:60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
    background:black;
}

.navbar h2{ color:#ffd600; }

.back{
    color:#00e676;
    text-decoration:none;
    font-weight:bold;
}

/* CENTER CARD */
.wrapper{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:420px;
    padding:45px;
    border-radius:22px;
    text-align:center;
    background:rgba(0,0,0,0.85);
    box-shadow:0 0 40px rgba(0,255,100,0.35);
}

.icon{
    font-size:65px;
    margin-bottom:10px;
}

.card h2{
    color:#ffd600;
    margin-bottom:15px;
}

.card p{
    color:#ddd;
    line-height:1.6;
}

/* button */
.btn{
    display:inline-block;
    margin-top:25px;
    text-decoration:none;
    padding:14px 28px;
    border-radius:12px;
    font-weight:700;
    background:linear-gradient(135deg,#00e676,#ffd600);
    color:black;
    box-shadow:0 0 20px rgba(0,255,100,0.7);
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 35px rgba(0,255,100,1);
}
</style>
</head>

<body>

<div class="navbar">
    <h2>💰 Fake Currency Detection</h2>
    <a href="/accounts/login/" class="back">⬅ Back to Login</a>
</div>

<div class="wrapper">
    <div class="card">
        <div class="icon">🔒</div>
        <h2>Password Changed Successfully!</h2>
        <p>Your password has been updated. You can now log in securely and continue using your account.</p>
        <a href="/accounts/login/" class="btn">Go to Login</a>
    </div>
</div>

</body>
</html>
