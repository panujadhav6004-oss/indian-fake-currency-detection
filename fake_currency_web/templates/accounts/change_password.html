{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* BACKGROUND */
body{
    min-height:100vh;
    color:white;
    background:url("{% static 'images/bg.jpg' %}") center/cover no-repeat fixed;
    display:flex;
    justify-content:center;
    align-items:center;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    z-index:-1;
}

/* NAVBAR */
.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 30px;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(10px);
}

.navbar h2{ color:#ffd600; font-size:20px; }

.logout{
    color:#00e676;
    text-decoration:none;
    font-weight:600;
    font-size:14px;
}

/* CARD */
.password-card{
    background:rgba(0,0,0,0.7);
    padding:35px;
    border-radius:20px;
    width:420px;
    backdrop-filter:blur(12px);
    box-shadow:0 0 30px rgba(0,255,100,0.25);
    margin-top:80px;
}

.password-card h2{
    text-align:center;
    color:#ffd600;
    margin-bottom:20px;
}

/* FORM */
form p{ margin-bottom:12px; }

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.08);
    color:white;
    outline:none;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    font-weight:700;
    background:linear-gradient(135deg,#00e676,#ffd600);
    color:black;
    cursor:pointer;
    box-shadow:0 0 20px rgba(0,255,100,0.6);
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<div class="navbar">
    <h2>💰 Fake Currency Detection</h2>
    <a class="logout" href="/accounts/profile/">⬅ Back to Profile</a>
</div>

<div class="password-card">
    <h2>Change Password</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Update Password</button>
    </form>
</div>

</body>
</html>
