<!DOCTYPE html>
<html>
<head>
    <title>Processing Payment</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050505;
    color:#fff;
}

.box{
    width:420px;
    padding:34px;
    border-radius:18px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(0,230,118,0.45);
    text-align:center;
    box-shadow:0 0 36px rgba(0,255,100,0.28);
}

.loader{
    width:70px;
    height:70px;
    margin:0 auto 22px;
    border:7px solid rgba(255,255,255,0.15);
    border-top-color:#00e676;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{ transform:rotate(360deg); }
}

h1{
    color:#ffd600;
    margin-bottom:12px;
}

p{
    color:#ddd;
    margin-bottom:8px;
}

.amount{
    color:#00e676;
    font-weight:700;
}
</style>

<script>
setTimeout(function(){
    window.location.href = "{% url 'payment_success' payment.id %}";
}, 3500);
</script>
</head>

<body>

<div class="box">
    <div class="loader"></div>
    <h1>Processing Payment</h1>
    <p>Connecting to bank...</p>
    <p>Verifying {{ payment.payment_method }} payment...</p>
    <p class="amount">Amount: Rs {{ payment.amount }}</p>
</div>

</body>
</html>
